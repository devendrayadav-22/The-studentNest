version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipsfinder-postgres
    restart: always
    environment:
      POSTGRES_DB: ipsfinder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipsfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipsfinder-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ipsfinder
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8080
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      DEMO_MODE: "true"
      COLLEGE_LAT: 22.6900
      COLLEGE_LNG: 75.8700
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  postgres_data:
  backend_uploads:
